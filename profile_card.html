<html>
    <head>
        <title>Profile Card</title>
        <style type="text/css">
            body{
                background-color: #f0f2f5;
                align-content: center;
                /* padding-left: 50px; */
                padding: 20px;
                align-items: center;
                display: flex;
                justify-content: center;
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 15px;
            }
            .card{
                width: 300px;
                background-color:#ffffff;
                /* min-height: 200vh; */
                border: 2px solid black;
                border-radius: 30px;
                justify-content: center;
                align-items: center;
                padding: 20px 10px;
                margin: 0px;
            }
            .image{
                width: 300px;
                height: 250px;
                border: 2px solid transparent;
                text-align: center;
                padding: 10px 5px;
                padding-right: 8px;
            }
            img{
                width: 200px;
                height: 250px;
                border: 2px solid ;
                border-radius: 30px;
                align-items: center;
                justify-items: center;
                object-fit: cover;
            }
            .name{
                font-weight: bold;
                text-align: center;
                font-style: italic;
                text-decoration:underline;
            }
            .job{
                font-style: italic;
                color: blue;
                text-align: center;
                font-size: 16px;
                object-fit: cover;
            }
            .bio{
                font-style:oblique;
                text-align: center;
            }
            button{
                text-align: center;
                background-color: blue;
                border-radius: 30px;
                /* padding: 15px 10px; */
                border: none;
                font-size: 20px;
            }
            .btn{
                text-align: center;
                background-color: blue;
                border-radius: 30px;
                padding: 15px 10px;
                border: none;
            }
            button:hover{
                font-size: 28px;
                /* background-color: lightgreen; */
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="image">
                <img src="C:\Users\alamb\OneDrive\Pictures\Camera Roll\ajay.jpeg" alt="Personal Photo">
            </div>
            <div class="name">
                <h2>Ajay Kumar</h2>
            </div>
            <div class="job">
                <p>Preparing for Frontened Development</p>
            </div>
            <div class="bio">
                <p>Myself Ajay Kumar pursuing BCA from JECRC University powered by Sunstone.<br>
                I am currently preparing for Web development</p>
            </div>
            <div class="btn">
                <a href="https://www.instagram.com//yadav_ajay91">
                <button>Follow Profile</button></a>
            </div>
        </div>
    </body>
</html>
